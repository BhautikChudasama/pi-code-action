name: "Pi Code Action"
description: "GitHub automation with Pi coding agent. Auto-detects mode: @pi mentions (tag mode) or prompt input (agent mode)."
branding:
  icon: "terminal"
  color: "purple"

inputs:
  trigger_phrase:
    description: "The trigger phrase to look for in comments or issue body"
    required: false
    default: "@pi"
  assignee_trigger:
    description: "The assignee username that triggers the action (e.g. @pi)"
    required: false
  label_trigger:
    description: "The label that triggers the action (e.g. pi)"
    required: false
    default: "pi"

  # Pi configuration
  prompt:
    description: "Instructions for Pi. Can be a direct prompt or custom template."
    required: false
    default: ""
  provider:
    description: "LLM provider (e.g. anthropic, openai, google)"
    required: false
    default: "anthropic"
  model:
    description: "Model to use (e.g. claude-sonnet-4-5, gpt-4o, gemini-2.5-pro)"
    required: false
    default: "claude-sonnet-4-5"
  thinking_level:
    description: "Thinking level (off, minimal, low, medium, high, xhigh, max)"
    required: false
    default: "off"
  pi_tools:
    description: "Comma-separated list of tools to allow (e.g. read,bash,edit,write,grep,find,ls)"
    required: false
    default: ""
  extensions:
    description: "Newline-separated list of Pi extensions to load (npm packages, git repos, or local paths)"
    required: false
    default: ""
  pi_args:
    description: "Additional arguments to pass directly to Pi CLI"
    required: false
    default: ""

  # Auth configuration
  api_key:
    description: "API key for the LLM provider"
    required: false
  github_token:
    description: "GitHub token with repo and pull request permissions (optional if using GitHub App)"
    required: false

  # Branch configuration
  base_branch:
    description: "The branch to use as the base/source when creating new branches"
    required: false
  branch_prefix:
    description: "The prefix to use for Pi branches"
    required: false
    default: "pi/"

  # Behavior configuration
  allowed_bots:
    description: "Comma-separated list of allowed bot usernames, or '*' to allow all bots"
    required: false
    default: ""
  use_sticky_comment:
    description: "Use just one comment to deliver issue/PR comments"
    required: false
    default: "false"
  bot_id:
    description: "GitHub user ID to use for git operations"
    required: false
    default: "41898282"
  bot_name:
    description: "GitHub username to use for git operations"
    required: false
    default: "pi[bot]"
  track_progress:
    description: "Force tag mode with tracking comments for pull_request and issue events"
    required: false
    default: "false"
  max_cost:
    description: "Maximum cost in USD before aborting the session"
    required: false
  max_turns:
    description: "Maximum number of LLM turns before aborting the session"
    required: false
  path_to_pi_executable:
    description: "Optional path to a custom Pi executable. Skips automatic installation if provided."
    required: false
    default: ""

outputs:
  execution_file:
    description: "Path to the Pi execution output file"
    value: ${{ steps.run.outputs.execution_file }}
  branch_name:
    description: "The branch created by Pi for this execution"
    value: ${{ steps.run.outputs.branch_name }}
  session_id:
    description: "The Pi session ID"
    value: ${{ steps.run.outputs.session_id }}

runs:
  using: "composite"
  steps:
    - name: Install Bun
      id: setup-bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14

    - name: Install Dependencies
      shell: bash
      run: |
        cd ${GITHUB_ACTION_PATH}
        bun install --production

    - name: Run Pi Code Action
      id: run
      shell: bash
      run: |
        bun --no-env-file \
          --config="${GITHUB_ACTION_PATH}/bunfig.toml" \
          run ${GITHUB_ACTION_PATH}/src/entrypoints/run.ts
      env:
        # Prepare inputs
        PROMPT: ${{ inputs.prompt }}
        TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        ASSIGNEE_TRIGGER: ${{ inputs.assignee_trigger }}
        LABEL_TRIGGER: ${{ inputs.label_trigger }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        BRANCH_PREFIX: ${{ inputs.branch_prefix }}
        OVERRIDE_GITHUB_TOKEN: ${{ inputs.github_token }}
        ALLOWED_BOTS: ${{ inputs.allowed_bots }}
        USE_STICKY_COMMENT: ${{ inputs.use_sticky_comment }}
        DEFAULT_WORKFLOW_TOKEN: ${{ github.token }}
        BOT_ID: ${{ inputs.bot_id }}
        BOT_NAME: ${{ inputs.bot_name }}
        TRACK_PROGRESS: ${{ inputs.track_progress }}
        PI_ARGS: ${{ inputs.pi_args }}

        # Pi configuration
        PI_PROVIDER: ${{ inputs.provider }}
        PI_MODEL: ${{ inputs.model }}
        PI_THINKING_LEVEL: ${{ inputs.thinking_level }}
        PI_TOOLS: ${{ inputs.pi_tools }}
        PI_EXTENSIONS: ${{ inputs.extensions }}
        PI_MAX_COST: ${{ inputs.max_cost }}
        PI_MAX_TURNS: ${{ inputs.max_turns }}
        PATH_TO_PI_EXECUTABLE: ${{ inputs.path_to_pi_executable }}

        # Auth
        PI_API_KEY: ${{ inputs.api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.api_key }}
        OPENAI_API_KEY: ${{ inputs.api_key }}
        GOOGLE_API_KEY: ${{ inputs.api_key }}

    - name: Revoke app token
      if: always() && inputs.github_token == '' && steps.run.outputs.github_token != ''
      shell: bash
      run: |
        curl -L \
          --connect-timeout 5 \
          --max-time 10 \
          -X DELETE \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ steps.run.outputs.github_token }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          ${GITHUB_API_URL:-https://api.github.com}/installation/token || true
